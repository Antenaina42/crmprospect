version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:rootpassword@db:3306/prospect_mada
      - NEXTAUTH_SECRET=prospect-mada-crm-secret-key-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: prospect_mada_mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: prospect_mada
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
